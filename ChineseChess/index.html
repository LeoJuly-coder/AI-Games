<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>象棋翻翻棋 - Q版风格</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">象棋翻翻棋</h1>
        
        <div class="game-info">
            <div class="player-info">
                <div class="player red" id="player-red">
                    <span class="player-name">红方</span>
                    <span class="player-represent" id="represent-red"></span>
                    <span class="player-captures" id="captures-red"></span>
                </div>
                <div class="turn-indicator" id="turn-indicator"></div>
                <div class="player black" id="player-black">
                    <span class="player-name">黑方</span>
                    <span class="player-represent" id="represent-black"></span>
                    <span class="player-captures" id="captures-black"></span>
                </div>
            </div>
            
            <div class="game-status" id="game-status">
                <p>点击暗棋翻开，或点击己方明棋移动</p>
            </div>
            
            <button class="restart-btn" id="restart-btn">重新开始</button>
        </div>
        
        <div class="board-container">
            <div class="board" id="board"></div>
        </div>
        
        <div class="rules-panel">
            <h3>游戏规则</h3>
            <ul>
                <li>棋子大小：将>士>象>车>马>炮>卒</li>
                <li>特殊：卒可吃将</li>
                <li>同级相遇同归于尽</li>
                <li>炮需隔子吃</li>
            </ul>
        </div>
        
        <div class="game-over-modal" id="game-over-modal" style="display: none;">
            <div class="modal-content">
                <h2 id="winner-text"></h2>
                <button class="restart-btn" id="modal-restart-btn">再来一局</button>
            </div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
